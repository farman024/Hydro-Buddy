<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>HydroBuddy — Stay Sharp, Stay Hydrated</title>
<meta name="theme-color" content="#00d4ff">
<meta name="description" content="Your personal AI hydration assistant. Friday-style voice reminders.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HydroBuddy">
<link rel="manifest" id="manifest-link">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap">
<style>
:root {
  --bg: #080c18;
  --bg-card: rgba(12, 20, 40, 0.92);
  --arc: #00d4ff;
  --arc-dim: rgba(0, 212, 255, 0.12);
  --arc-glow: rgba(0, 212, 255, 0.35);
  --arc-pulse: rgba(0, 212, 255, 0.5);
  --blue: #3b82f6;
  --blue-deep: #1e40af;
  --cyan: #22d3ee;
  --text: #94a3b8;
  --text-dim: #475569;
  --text-bright: #e2e8f0;
  --text-arc: #7dd3fc;
  --glass-empty: #1a2340;
  --glass-full: #00d4ff;
  --success: #22c55e;
  --border: rgba(0, 212, 255, 0.12);
  --border-glow: rgba(0, 212, 255, 0.25);
  --shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
  --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.25);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  color: var(--text-bright);
  overflow-x: hidden;
}



body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(0, 212, 255, 0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(59, 130, 246, 0.03) 0%, transparent 50%),
    linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
  pointer-events: none;
  z-index: 0;
}

.app {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  padding: 20px 16px 120px;
}

/* ─── HUD HEADER ─── */
.hud-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  padding: 0 2px;
  position: relative;
}
.hud-header::after {
  content: '';
  position: absolute;
  bottom: -8px; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,0.15), transparent);
}
.hud-badge {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 2px;
}
.hud-badge::before { content: '◤ '; color: var(--arc); }
.hud-badge::after { content: ' ◢'; color: var(--arc); }
.hud-settings {
  width: 36px; height: 36px;
  background: transparent;
  border: 1px solid rgba(0,212,255,0.08);
  border-radius: 10px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-dim);
  transition: all 0.2s;
}
.hud-settings:hover { border-color: var(--arc); color: var(--arc); }
.hud-settings:active { transform: scale(0.92); }

/* ─── INSTALL BANNER ─── */
.install-banner {
  background: linear-gradient(135deg, var(--arc), var(--blue));
  border-radius: 18px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  box-shadow: 0 6px 24px var(--arc-glow);
  display: none;
}
.install-banner.show { display: flex; }
.install-banner p { color: white; font-size: 13px; font-weight: 500; flex: 1; }
.install-banner p strong { display: block; font-size: 14px; }
.install-btn {
  background: rgba(255,255,255,0.25);
  color: white;
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.2s;
}
.install-btn:active { transform: scale(0.95); }
.dismiss-install {
  background: none; border: none; color: rgba(255,255,255,0.7);
  font-size: 18px; cursor: pointer; padding: 4px; margin-left: 8px;
}

/* ─── REACTOR ZONE ─── */
.reactor-zone {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 0 20px;
  margin-bottom: 4px;
}
.reactor-zone::before {
  content: '';
  position: absolute;
  top: 10%; left: -20px; right: -20px;
  bottom: 0;
  background: radial-gradient(ellipse at 50% 60%, rgba(0,212,255,0.05) 0%, transparent 70%);
  pointer-events: none;
}

.reactor {
  position: relative;
  width: 200px;
  height: 200px;
}
.reactor svg { transform: rotate(-90deg); display: block; }

.arc-track { fill: none; stroke: rgba(0,212,255,0.06); stroke-width: 7; }
.arc-fill {
  fill: none; stroke: url(#arc-g); stroke-width: 7; stroke-linecap: round;
  transition: stroke-dashoffset 1s cubic-bezier(0.4,0,0.2,1);
}
.arc-outer { animation: arcSpin 8s linear infinite; transform-origin: 50px 50px; }
@keyframes arcSpin { to { transform: rotate(360deg); } }
.arc-core-dot { animation: dotPulse 2s ease-in-out infinite; }
@keyframes dotPulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }

/* Glass orbit dots */
.gd { transition: all 0.4s cubic-bezier(0.4,0,0.2,1); }
.gd.active { fill: var(--arc); stroke: var(--arc); stroke-width: 2; filter: drop-shadow(0 0 6px var(--arc-glow)); }

/* ─── DATA PANEL ─── */
.data-panel {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 12px 20px;
  margin-top: 10px;
  border: 1px solid rgba(0,212,255,0.06);
  border-radius: 10px;
  background: rgba(0,212,255,0.02);
}
.data-item { text-align: center; }
.data-num {
  font-family: 'Playfair Display', serif;
  font-size: 24px;
  font-weight: 900;
  color: var(--text-bright);
  line-height: 1;
}
.data-slash { color: var(--text-dim); font-size: 18px; margin: 0 2px; }
.data-unit {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 2px;
  letter-spacing: 1.5px;
}
.data-divider {
  width: 1px;
  height: 34px;
  background: rgba(0,212,255,0.06);
}

/* ─── STAT GRID ─── */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2px;
  margin: 0 auto 16px;
  max-width: 320px;
  width: 100%;
  position: relative;
  border-top: 1px solid rgba(0,212,255,0.06);
  padding-top: 14px;
}
.stat-cell { text-align: center; }
.stat-val {
  display: block;
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  font-weight: 900;
  color: var(--text-bright);
  line-height: 1.1;
}
.stat-lbl {
  display: block;
  font-size: 8px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 1.5px;
  margin-top: 2px;
}

/* ─── HUD PROGRESS ─── */
.hud-progress {
  position: relative;
  margin: 0 auto 18px;
  max-width: 320px;
  width: 100%;
}
.hud-progress-track {
  background: rgba(0,212,255,0.04);
  border-radius: 100px;
  height: 3px;
  overflow: hidden;
  position: relative;
}
.hud-progress-track::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(90deg, transparent, transparent calc(100%/7 - 1px), rgba(0,212,255,0.04) calc(100%/7 - 1px), rgba(0,212,255,0.04) calc(100%/7));
}
.hud-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), var(--arc));
  border-radius: 100px;
  transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 0 10px var(--arc-glow);
  position: relative; z-index: 1;
}
.hud-progress-labels {
  display: flex; justify-content: space-between;
  margin-top: 5px;
  font-size: 9px; color: rgba(255,255,255,0.2);
  letter-spacing: 0.5px;
}

/* ─── ACTION DOCK ─── */
.action-dock {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  max-width: 320px;
  width: 100%;
  margin-left: auto; margin-right: auto;
}
.btn-primary {
  flex: 1;
  padding: 13px;
  background: linear-gradient(135deg, var(--arc), var(--blue));
  color: #fff; border: none;
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 700;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(0,212,255,0.2);
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-primary:hover { box-shadow: 0 0 28px var(--arc-glow); }
.btn-primary:active { transform: scale(0.97); }
.btn-secondary {
  width: 44px;
  background: transparent;
  border: 1px solid rgba(0,212,255,0.08);
  border-radius: 10px;
  color: var(--text-dim);
  font-size: 16px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
  font-family: 'DM Sans', sans-serif;
}
.btn-secondary:hover { border-color: rgba(0,212,255,0.3); color: var(--arc); }
.btn-secondary:active { transform: scale(0.93); }

/* ─── AI COMMS ─── */
.ai-comms {
  border-top: 1px solid rgba(0,212,255,0.06);
  padding-top: 12px;
}
.comms-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
}
.comms-tag {
  font-size: 9px;
  font-weight: 700;
  color: var(--arc);
  letter-spacing: 1.5px;
  min-width: 32px;
}
.comms-time {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--text-bright);
  line-height: 1;
}
.comms-delay {
  font-size: 11px;
  color: var(--text-dim);
  margin-left: auto;
}
.comms-toggle {
  padding: 6px 14px;
  background: transparent;
  border: 1px solid rgba(0,212,255,0.1);
  border-radius: 8px;
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.comms-toggle #toggle-label { font-size: 12px; font-weight: 500; letter-spacing: 0.5px; }
.comms-toggle:hover { border-color: var(--arc); color: var(--arc); }
.comms-toggle.active { border-color: var(--arc); color: var(--arc); }
.friday-avatar {
  width: 32px; height: 32px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #080c18;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(0,212,255,0.06);
}
.comms-msg {
  font-size: 12px;
  color: var(--text);
  font-style: italic;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ─── SETTINGS MODAL ─── */

/* ─── SETTINGS MODAL ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
}
.modal-overlay.open { display: block; }

.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px);
}

.modal-sheet {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: #0a1028;
  border: 1px solid rgba(0, 212, 255, 0.08);
  border-radius: 28px 28px 0 0;
  max-height: 92vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
}
.modal-overlay.open .modal-sheet { transform: translateY(0); }

.modal-handle {
  width: 40px; height: 4px;
  background: rgba(0, 212, 255, 0.15);
  border-radius: 100px;
  margin: 12px auto 0;
}

.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 20px 0;
  position: sticky; top: 0;
  background: #0a1028;
  z-index: 1;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}

.modal-title {
  font-family: 'Playfair Display', serif;
  font-size: 22px; font-weight: 700; color: var(--text-bright);
}

.close-btn {
  width: 36px; height: 36px;
  background: rgba(0, 212, 255, 0.08);
  border: 1px solid rgba(0, 212, 255, 0.12);
  border-radius: 10px;
  cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text);
  transition: all 0.2s;
}
.close-btn:hover { border-color: var(--arc); color: var(--arc); }
.close-btn:active { transform: scale(0.9); }

.modal-body { padding: 16px 20px 40px; }

.form-group { margin-bottom: 20px; }
.form-label {
  display: block;
  font-size: 12px; font-weight: 600;
  color: var(--text);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.form-input {
  width: 100%;
  padding: 13px 16px;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(0, 212, 255, 0.1);
  border-radius: 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  color: var(--text-bright);
  transition: border-color 0.2s;
  outline: none;
  appearance: none;
}
.form-input:focus { border-color: var(--arc); box-shadow: 0 0 14px var(--arc-glow); }
.form-input option { background: #0a1028; }

.mode-toggle {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}

.mode-btn {
  padding: 12px;
  border-radius: 12px;
  border: 2px solid transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.mode-btn.active {
  background: linear-gradient(135deg, var(--arc), var(--blue));
  color: #fff;
  box-shadow: 0 0 16px var(--arc-glow);
}
.mode-btn.inactive {
  background: rgba(0, 0, 0, 0.3);
  color: var(--text);
  border: 1px solid rgba(0, 212, 255, 0.08);
}

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sub-label { font-size: 11px; color: var(--text); margin-bottom: 6px; display: block; }

.custom-time-row { display: flex; gap: 8px; margin-bottom: 8px; }
.custom-time-row .form-input { flex: 1; }
.remove-time-btn {
  width: 44px; height: 44px;
  background: rgba(0, 212, 255, 0.06);
  border: 1px solid rgba(0, 212, 255, 0.1);
  border-radius: 12px;
  color: var(--arc);
  cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.remove-time-btn:hover { background: rgba(0, 212, 255, 0.12); }

.add-time-btn {
  width: 100%; padding: 11px;
  background: rgba(0, 0, 0, 0.2);
  border: 1px dashed rgba(0, 212, 255, 0.2);
  border-radius: 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 600;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 4px;
}
.add-time-btn:hover { border-color: var(--arc); color: var(--arc); }
.add-time-btn:active { transform: scale(0.98); }

.range-wrap { position: relative; }
.form-range {
  width: 100%; height: 6px;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 100px;
  outline: none;
  appearance: none;
  cursor: pointer;
}
.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px; height: 20px;
  background: var(--arc);
  border-radius: 50%;
  box-shadow: 0 0 12px var(--arc-glow);
}

.btn-row { display: flex; gap: 10px; margin-bottom: 16px; }
.outline-btn {
  flex: 1; padding: 12px;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(0, 212, 255, 0.1);
  border-radius: 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 600;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.outline-btn:hover { border-color: var(--arc); color: var(--arc); }
.outline-btn:active { transform: scale(0.97); }

.save-btn {
  width: 100%; padding: 16px;
  background: linear-gradient(135deg, var(--arc), var(--blue));
  color: #fff; border: none;
  border-radius: 16px;
  font-family: 'DM Sans', sans-serif;
  font-size: 16px; font-weight: 700;
  cursor: pointer;
  box-shadow: 0 0 24px var(--arc-glow);
  transition: all 0.2s;
}
.save-btn:hover { box-shadow: 0 0 32px var(--arc-pulse); }
.save-btn:active { transform: scale(0.98); }

/* ─── TOAST ─── */
.toast-container {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  width: calc(100% - 32px);
  max-width: 420px;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}

.toast {
  background: #0a1028;
  color: white;
  border-radius: 14px;
  padding: 14px 18px;
  font-size: 14px; font-weight: 500;
  box-shadow: 0 8px 32px rgba(26,18,8,0.25);
  display: flex; align-items: center; gap: 10px;
  pointer-events: auto;
  animation: toastIn 0.35s cubic-bezier(0.4,0,0.2,1);
}

@keyframes toastIn {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.toast.success .toast-icon { color: var(--success); }
.toast.info .toast-icon { color: var(--arc); }
.toast.error .toast-icon { color: #ef4444; }

/* ─── SECTION DIVIDER ─── */
.section-divider {
  display: flex; align-items: center; gap: 10px;
  margin: 4px 0 14px;
}
.friday-side {
  display: none;
  transition: filter 0.3s;
  position: relative;
}
.friday-side.speaking {
  filter: drop-shadow(0 0 40px var(--arc-glow)) brightness(1.3);
  animation: talkBounce 0.4s ease-in-out 6;
}
@keyframes talkBounce {
  0%,100% { transform: translateY(-50%) scale(1); }
  50% { transform: translateY(-50%) scale(1.05); }
}
.friday-bubble {
  display: none;
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  margin-bottom: 12px;
  background: rgba(8, 12, 24, 0.92);
  border: 1px solid rgba(0, 212, 255, 0.2);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 12px;
  color: var(--text-bright);
  white-space: nowrap;
  max-width: 240px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  z-index: 5;
  pointer-events: none;
  line-height: 1.4;
}
.friday-side.speaking .friday-bubble { display: block; }
.friday-bubble::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: rgba(0, 212, 255, 0.2);
}
.friday-side img {
  width: 100%;
  height: auto;
  max-height: 90vh;
  display: block;
  object-fit: contain;
}
.divider-line { flex: 1; height: 1px; background: rgba(0, 212, 255, 0.1); }
.divider-text { font-size: 10px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

/* ─── DESKTOP ─── */
@media (min-width: 768px) {
  .app { max-width: 900px; padding: 30px 32px 80px; }
  body { padding: 0; }

  .hud-header { margin-bottom: 20px; }
  .hud-badge { font-size: 12px; }

  .reactor-zone { flex-direction: row; align-items: center; gap: 40px; padding: 40px 0; }
  .reactor { width: 240px; height: 240px; }
  .data-panel { margin-top: 0; padding: 16px 32px; }
  .data-num { font-size: 28px; }
  .data-unit { font-size: 11px; }

  .stat-grid { max-width: 100%; padding-top: 18px; margin-bottom: 20px; }
  .stat-val { font-size: 22px; }
  .stat-lbl { font-size: 9px; }

  .hud-progress { max-width: 100%; }
  .action-dock { max-width: 100%; }
  .btn-primary { padding: 14px; font-size: 14px; }
  .btn-secondary { width: 50px; font-size: 18px; }

  .comms-time { font-size: 22px; }
  .comms-msg { font-size: 14px; }

  .modal-sheet { max-width: 520px; left: 50%; transform: translateX(-50%) translateY(100%); border-radius: 28px; }
  .modal-overlay.open .modal-sheet { transform: translateX(-50%) translateY(0); }
  .modal-body { padding: 16px 28px 40px; }
  .form-input { font-size: 14px; }
  .save-btn { font-size: 15px; }
  .toast { font-size: 14px; padding: 16px 22px; }
}

};

function getFridayPhrase(type, n = state.glassesDrunk) {
  const list = fridayPhrases[type] || fridayPhrases.idle;
  const fn = list[Math.floor(Math.random() * list.length)];
  return fn(n);
}

function getTimeOfDayPhrase() {
  const h = new Date().getHours();
  if (h < 11) return getFridayPhrase('morning');
  if (h < 15) return getFridayPhrase('afternoon', state.glassesDrunk);
  if (h < 20) return getFridayPhrase('onTrack', state.glassesDrunk);
  return getFridayPhrase('evening', state.glassesDrunk);
}

// ═══════════════════════════════════════════
// SPEECH
// ═══════════════════════════════════════════
function getFemaleVoice() {
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  if (!voices || voices.length === 0) {
    console.log('❌ No voices available');
    return null;
  }

  console.log('🔊 Available voices:');
  voices.forEach(v => {
    console.log(`   • ${v.name} (lang: ${v.lang}, gender: ${v.gender || 'unknown'}, default: ${v.default})`);
  });

  // Advanced voice selection with gender and name priority
  let selectedVoice = null;

  // Priority 1: Known female voices by name (macOS/iOS)
  const femaleVoices = voices.filter(v => {
    const name = v.name.toLowerCase();
    return name.includes('karen') || name.includes('samantha') ||
           name.includes('zira') || name.includes('hazel') || name.includes('moira') ||
           name.includes('fiona') || name.includes('victoria') || name.includes('pauline') ||
           name.includes('petra') || name.includes('eva') || name.includes('ingrid') ||
           name.includes('female') || (v.gender && v.gender === 'female');
  });

  if (femaleVoices.length > 0) {
    selectedVoice = femaleVoices[0];
    console.log('👩 Selected female voice by name/gender:', selectedVoice.name);
  }

  // Priority 2: English voices with feminine characteristics
  if (!selectedVoice) {
    const enVoices = voices.filter(v => v.lang && v.lang.startsWith('en'));
    if (enVoices.length > 0) {
      // Filter out obviously male names
      const maleNames = ['david', 'steve', 'john', 'james', 'robert', 'william', 'michael', 'richard', 'paul', 'brian', 'charles', 'gary', 'jeff', 'johnny', 'mike', 'bill', 'mark', 'tom', 'ted', 'tim'];

      const feminineEnglish = enVoices.filter(v => {
        const name = v.name.toLowerCase();
        return !maleNames.some(male => name === male || name.includes(male));
      });

      if (feminineEnglish.length > 0) {
        selectedVoice = feminineEnglish[0];
        console.log('👩 Selected feminine English voice:', selectedVoice.name);
      } else {
        selectedVoice = enVoices[0];
        console.log('👩 Selected English voice (no clear female):', selectedVoice.name);
      }
    }
  }

  // Final fallback: any available voice
  if (!selectedVoice && voices.length > 0) {
    selectedVoice = voices[0];
    console.log('⚠️ No clear female voice found, using:', selectedVoice.name);
  }

  console.log('✅ Final voice selection:', selectedVoice?.name, '(gender:', selectedVoice?.gender, ')');
  return selectedVoice;
}

let _speechQueue = Promise.resolve();
function speak(text) {
  try {
    if (!window.speechSynthesis) return;

    // Chain speaks to avoid Chrome cancel-then-speak bug
    _speechQueue = _speechQueue.then(() => new Promise(resolve => {
      // Load voices if needed
      const loadVoices = (attempt) => {
        try {
          if (attempt > 10) { resolve(); return; }
          const voices = window.speechSynthesis.getVoices();
          if (voices.length === 0) {
            window.speechSynthesis.onvoiceschanged = () => loadVoices(attempt + 1);
            return;
          }

          window.speechSynthesis.cancel();

          const utterance = new SpeechSynthesisUtterance(text);
          let voice = null;
          // Try user-selected voice first
          if (state.selectedVoice) {
            voice = window.speechSynthesis.getVoices().find(v => v.name === state.selectedVoice);
          }
          // Fall back to fresh female voice detection
          if (!voice) voice = getFemaleVoice();
          if (voice) utterance.voice = voice;
          utterance.volume = 1;
          utterance.rate = state.rate * 1.0;
          utterance.pitch = state.pitch * 1.0;

          utterance.onend = resolve;
          utterance.onerror = resolve;

          // Small delay to let cancel() settle (Chrome workaround)
          setTimeout(() => {
            try { window.speechSynthesis.speak(utterance); } catch(e) { resolve(); }
          }, 50);
        } catch(e) { resolve(); }
      };
      loadVoices(0);
    })).catch(() => {}); // keep chain alive on error
  } catch(e) {
    // Silent fallback for browser restrictions
  }
}

let _femaleVoice = null;
function initVoices() {
  // Initialize speech synthesis
  const checkVoices = () => {
    const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    if (voices.length > 0) {
      // Store female voice for reuse
      _femaleVoice = getFemaleVoice();

      // Populate voice dropdown with English voices
      const select = document.getElementById('voice-select');
      select.innerHTML = '';
      const enVoices = voices.filter(v => v.lang && v.lang.startsWith('en'));
      (enVoices.length ? enVoices : voices).forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.name;
        opt.textContent = `${v.name} (${v.lang})`;
        if (state.selectedVoice === v.name) opt.selected = true;
        if (!state.selectedVoice && v.name === _femaleVoice?.name) opt.selected = true;
        select.appendChild(opt);
      });

      if (_femaleVoice) {
        console.log('👩 Female voice found:', _femaleVoice.name);
      }
    } else {
      // Wait for voices to load
      setTimeout(checkVoices, 100);
    }
  };
  checkVoices();
}

async function checkNotificationPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    const perm = await Notification.requestPermission();
    if (perm === 'granted') showToast('Notifications enabled', 'success');
  }
}

function sendNotification(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const n = new Notification(title, {
    body,
    icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💧</text></svg>',
    badge: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💧</text></svg>',
    tag: 'hydrobuddy-reminder',
    renotify: true,
    vibrate: [200, 100, 200]
  });
  n.onclick = () => { window.focus(); n.close(); };
}

// ═══════════════════════════════════════════
// REMINDERS
// ═══════════════════════════════════════════
function toggleReminders() {
  state.remindersActive = !state.remindersActive;
  if (state.remindersActive) {
    checkNotificationPermission();
    scheduleNext();
    updateReminderUI();
    const phrase = getTimeOfDayPhrase();
    speak(phrase);
    updateFriday(phrase);
    showToast('Friday is watching', 'success');
  } else {
    clearTimeout(reminderTimer);
    clearInterval(countdownTimer);
    state.nextReminderTimestamp = null;
    updateReminderUI();
    speak(`Reminders paused, Boss. Stay disciplined on your own.`);
    showToast('Reminders paused', 'info');
  }
  saveState();
}

function calcNextTime() {
  const now = new Date();
  let nextTime = null;

  if (state.reminderMode === 'interval') {
    const ms = state.intervalHours * 60 * 60 * 1000;
    nextTime = new Date(now.getTime() + ms);
  } else {
    const times = [...state.customTimes].sort();
    const nowStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    const next = times.find(t => t > nowStr) || times[0];
    if (!next) return null;
    const [h, m] = next.split(':').map(Number);
    nextTime = new Date();
    nextTime.setHours(h, m, 0, 0);
    if (nextTime <= now) nextTime.setDate(nextTime.getDate() + 1);
  }

  // Clamp to active hours
  const [startH, startM] = state.startHour.split(':').map(Number);
  const [endH, endM] = state.endHour.split(':').map(Number);
  const startBound = new Date(nextTime); startBound.setHours(startH, startM, 0, 0);
  const endBound   = new Date(nextTime); endBound.setHours(endH, endM, 0, 0);
  if (nextTime > endBound)  nextTime = new Date(startBound.getTime() + 86400000);
  if (nextTime < startBound) nextTime = startBound;
  return nextTime;
}

function scheduleNext() {
  clearTimeout(reminderTimer);
  clearInterval(countdownTimer);

  const nextTime = calcNextTime();
  if (!nextTime) return;

  state.nextReminderTimestamp = nextTime.getTime();
  saveState(); // persist so SW can recover after sleep

  const delay = nextTime.getTime() - Date.now();

  // Primary: JS setTimeout
  reminderTimer = setTimeout(fireReminder, delay);

  // Backup: ask SW to also fire a notification at the same time
  // so it works even when the tab is backgrounded / phone asleep
  if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({
      type: 'SCHEDULE_NOTIFICATION',
      delay: Math.max(delay, 0),
      title: 'HydroBuddy',
      body: `Time to hydrate, Boss! Glass ${state.glassesDrunk + 1} of ${state.targetGlasses}`
    });
  }

  updateCountdown();
  countdownTimer = setInterval(() => {
    // Drift correction: if we somehow missed the fire, trigger now
    if (state.remindersActive && state.nextReminderTimestamp && Date.now() >= state.nextReminderTimestamp + 5000) {
      fireReminder();
      return;
    }
    updateCountdown();
  }, 1000);
  updateReminderUI();
}

function fireReminder() {
  if (!state.remindersActive) return;
  const n = state.glassesDrunk;
  let phrase, type;
  const total = state.targetGlasses;

  if (n >= total) {
    phrase = getFridayPhrase('goal');
    type = 'success';
  } else {
    const pace = expectedPace();
    phrase = n < pace ? getFridayPhrase('behind', n) : getFridayPhrase('reminder', n);
    type = 'info';
  }

  speak(phrase);
  updateFriday(phrase);
  sendNotification('HydroBuddy', `Glass ${n + 1} of ${total} — time to hydrate, Boss`);
  showToast('Friday: Time to drink', type);
  scheduleNext();
}

function expectedPace() {
  const now = new Date();
  const [sh, sm] = state.startHour.split(':').map(Number);
  const [eh, em] = state.endHour.split(':').map(Number);
  const totalMins = (eh * 60 + em) - (sh * 60 + sm);
  const elapsedMins = (now.getHours() * 60 + now.getMinutes()) - (sh * 60 + sm);
  const ratio = Math.max(0, Math.min(1, elapsedMins / totalMins));
  return Math.floor(ratio * state.targetGlasses);
}

function updateCountdown() {
  if (!state.nextReminderTimestamp) return;
  const diff = state.nextReminderTimestamp - Date.now();
  if (diff <= 0) { document.getElementById('next-reminder-countdown').textContent = 'Any moment now...'; return; }
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  const parts = [];
  if (h > 0) parts.push(`${h}h`);
  if (m > 0 || h > 0) parts.push(`${m}m`);
  parts.push(`${s}s`);
  document.getElementById('next-reminder-countdown').textContent = `in ${parts.join(' ')}`;
}

function updateReminderUI() {
  const btn = document.getElementById('toggle-reminders');
  const icon = document.getElementById('toggle-icon');
  const label = document.getElementById('toggle-label');

  if (state.remindersActive) {
    btn.classList.add('active');
    icon.textContent = '⏸';
    label.textContent = 'Pause';
  } else {
    btn.classList.remove('active');
    icon.textContent = '▶';
    label.textContent = 'Start';
  }

  if (state.nextReminderTimestamp) {
    const d = new Date(state.nextReminderTimestamp);
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    document.getElementById('next-reminder-time').textContent = `${h}:${m}`;
  } else {
    document.getElementById('next-reminder-time').textContent = '--:--';
    document.getElementById('next-reminder-countdown').textContent = 'Start reminders to begin';
  }
}

// ═══════════════════════════════════════════
// WATER LOGGING
// ═══════════════════════════════════════════
function fridayTalk(phrase) {
  updateFriday(phrase);
  const el = document.querySelector('.friday-side');
  if (el) {
    const bubble = el.querySelector('.friday-bubble');
    if (bubble) bubble.textContent = `"${phrase}"`;
    el.classList.add('speaking');
    clearTimeout(el._talkTimer);
    el._talkTimer = setTimeout(() => el.classList.remove('speaking'), 3500);
  }
  // Speak directly within user gesture — no cancel/delay/queue (mobile autoplay policy)
  try {
    if (window.speechSynthesis) {
      const u = new SpeechSynthesisUtterance(phrase);
      u.volume = 1;
      u.rate = state.rate || 0.9;
      u.pitch = state.pitch || 1.1;
      window.speechSynthesis.speak(u);
    }
  } catch(e) {}
}

function drinkGlass() {
  if (state.glassesDrunk >= state.targetGlasses) {
    showToast('Goal already reached!', 'success'); return;
  }
  state.glassesDrunk++;
  state.logTimes.push(new Date().toISOString());
  saveState();
  renderOrbit();
  updateProgressUI();

  if (state.glassesDrunk === state.targetGlasses) {
    const phrase = getFridayPhrase('goal');
    fridayTalk(phrase);
    showToast('Goal complete! Amazing!', 'success');
    sendNotification('Goal Reached!', `${state.targetGlasses} glasses done, Boss! Outstanding!`);
  } else {
    const phrase = getFridayPhrase('onTrack', state.glassesDrunk);
    fridayTalk(phrase);
    showToast('Glass logged!', 'success');
  }
}

function resetDay() {
  if (!confirm('Reset today\'s progress?')) return;
  state.glassesDrunk = 0;
  state.logTimes = [];
  saveState();
  renderOrbit();
  updateProgressUI();
  updateFriday(getFridayPhrase('idle'));
  showToast('Reset done', 'info');
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function renderOrbit() {
  for (let i = 0; i < 7; i++) {
    const dot = document.querySelector(`.gd${i}`);
    if (!dot) continue;
    const full = i < state.glassesDrunk;
    dot.classList.toggle('active', full);
  }
}

function updateProgressUI() {
  const pct = Math.round((state.glassesDrunk / state.targetGlasses) * 100);
  const ml = state.glassesDrunk * state.mlPerGlass;
  const mlTotal = state.targetGlasses * state.mlPerGlass;

  document.getElementById('glasses-drunk').textContent = state.glassesDrunk;
  document.getElementById('glasses-target').textContent = state.targetGlasses;
  document.getElementById('ml-drunk').textContent = ml;
  document.getElementById('ml-target').textContent = mlTotal;
  document.getElementById('ml-target-label').textContent = mlTotal + 'ml';

  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-pct').textContent = pct + '%';

  // Circle
  const circ = 238.8;
  const offset = circ - (circ * pct / 100);
  document.getElementById('circle-fill').style.strokeDashoffset = offset;

  // Stats
  document.getElementById('remaining-count').textContent = Math.max(0, state.targetGlasses - state.glassesDrunk);
  document.getElementById('streak-count').textContent = state.streak;

  // Avg gap
  if (state.logTimes.length >= 2) {
    const gaps = [];
    for (let i = 1; i < state.logTimes.length; i++) {
      gaps.push(new Date(state.logTimes[i]) - new Date(state.logTimes[i - 1]));
    }
    const avgMs = gaps.reduce((a, b) => a + b, 0) / gaps.length;
    const avgMin = Math.round(avgMs / 60000);
    document.getElementById('avg-time').textContent = avgMin >= 60
      ? Math.round(avgMin / 60) + 'h'
      : avgMin + 'm';
  } else {
    document.getElementById('avg-time').textContent = '--';
  }

  document.getElementById('user-name-display').textContent = state.userName;
}

function updateFriday(msg) {
  document.getElementById('friday-message').textContent = `"${msg}"`;
}

// ═══════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════
function saveState() {
  state.lastDate = new Date().toDateString();
  localStorage.setItem('hydroBuddy_v2', JSON.stringify(state));
}

function loadState() {
  const saved = localStorage.getItem('hydroBuddy_v2');
  if (!saved) return;
  const parsed = JSON.parse(saved);
  const today = new Date().toDateString();
  if (parsed.lastDate !== today) {
    if (parsed.glassesDrunk >= parsed.targetGlasses) parsed.streak = (parsed.streak || 0) + 1;
    else if (parsed.glassesDrunk > 0) parsed.streak = 0;
    parsed.glassesDrunk = 0;
    parsed.logTimes = [];
    parsed.remindersActive = false;
    parsed.nextReminderTimestamp = null;
  }
  Object.assign(state, parsed);
}

function applyStateToUI() {
  document.getElementById('user-name').value = state.userName;
  document.getElementById('interval-hours').value = state.intervalHours;
  document.getElementById('start-hour').value = state.startHour;
  document.getElementById('end-hour').value = state.endHour;
  document.getElementById('voice-volume').value = state.volume * 100;
  document.getElementById('volume-value').textContent = Math.round(state.volume * 100);
  document.getElementById('voice-rate').value = state.rate;
  document.getElementById('rate-value').textContent = state.rate;
  document.getElementById('voice-pitch').value = state.pitch;
  document.getElementById('pitch-value').textContent = state.pitch;
  document.getElementById('target-glasses').value = state.targetGlasses;
  document.getElementById('ml-per-glass').value = state.mlPerGlass;
  setMode(state.reminderMode);
  renderCustomTimes();
}

// ═══════════════════════════════════════════
// EXPORT / IMPORT
// ═══════════════════════════════════════════
function exportData() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    data[key] = JSON.parse(localStorage.getItem(key));
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `hydro-buddy-backup-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  document.getElementById('data-status').textContent = 'Data exported successfully';
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        Object.keys(data).forEach(key => localStorage.setItem(key, JSON.stringify(data[key])));
        loadState();
        applyStateToUI();
        renderOrbit();
        updateProgressUI();
        updateReminderUI();
        document.getElementById('data-status').textContent = 'Data imported. Settings applied.';
        showToast('Data restored from backup', 'success');
      } catch {
        document.getElementById('data-status').textContent = 'Invalid backup file';
        showToast('Import failed', 'error');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ═══════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════
function showToast(msg, type = 'info') {
  const container = document.getElementById('toast-container');
  const iconSvg = {
    success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><polyline points="20 6 9 17 4 12"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M12 2C12 2 5 10 5 14a7 7 0 0 0 14 0c0-4-7-12-7-12z"/></svg>',
    error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
  };
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span class="toast-icon">${iconSvg[type]}</span><span>${msg}</span>`;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

// ═══════════════════════════════════════════
// PWA — INLINE MANIFEST + SERVICE WORKER
// ═══════════════════════════════════════════

// Inline Web App Manifest
(function() {
  const m = {
    name: 'HydroBuddy',
    short_name: 'HydroBuddy',
    description: 'Your personal AI hydration assistant',
    start_url: './',
    display: 'standalone',
    background_color: '#080c18',
    theme_color: '#00d4ff',
    orientation: 'portrait-primary',
    icons: [
      { src: 'icon.svg', sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
    ]
  };
  const blob = new Blob([JSON.stringify(m)], { type: 'application/json' });
  document.getElementById('manifest-link').href = URL.createObjectURL(blob);
})();

// Inline Service Worker
(function() {
  const swCode = `
    const CACHE = 'hydrobuddy-v1';
    const URLS = ['/'];
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(URLS)));
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(
        caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k))))
      );
      self.clients.claim();
    });
    self.addEventListener('fetch', e => {
      if (e.request.url.includes('supabase') || e.request.url.includes('googleapis')) {
        return fetch(e.request);
      }
      e.respondWith(
        caches.match(e.request).then(r => r || fetch(e.request).catch(() => new Response('Offline', { status: 503 })))
      );
    });
  `;
  const swBlob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(swBlob);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register(swUrl).then(reg => {
      console.log('SW registered');
    }).catch(err => console.log('SW error:', err));
  }
})();

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  if (!localStorage.getItem('installDismissed')) {
    document.getElementById('install-banner').classList.add('show');
  }
});

document.getElementById('install-btn').onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') showToast('App installed!', 'success');
  deferredPrompt = null;
  document.getElementById('install-banner').classList.remove('show');
};

document.getElementById('dismiss-install').onclick = () => {
  document.getElementById('install-banner').classList.remove('show');
  localStorage.setItem('installDismissed', '1');
};

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  loadState();
  applyStateToUI();
  initVoices();
  renderOrbit();
  updateProgressUI();
  updateReminderUI();
  updateFriday(getTimeOfDayPhrase());
  checkNotificationPermission();

  if (state.remindersActive) {
    // Re-arm reminders after page reload
    const missed = state.nextReminderTimestamp && Date.now() > state.nextReminderTimestamp;
    if (missed) {
      // We missed one — fire immediately then schedule next
      setTimeout(() => fireReminder(), 1500);
    } else {
      scheduleNext();
    }
    updateReminderUI();
  }
});

// Page Visibility API — catches phone wake-from-sleep
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.remindersActive) {
    const missed = state.nextReminderTimestamp && Date.now() > state.nextReminderTimestamp + 3000;
    if (missed) {
      fireReminder();
    } else if (state.nextReminderTimestamp) {
      // Re-arm setTimeout in case it was killed by the browser
      clearTimeout(reminderTimer);
      const delay = Math.max(state.nextReminderTimestamp - Date.now(), 0);
      reminderTimer = setTimeout(fireReminder, delay);
    }
  }
});
